
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111411">
<title>GYMLOG</title>

<style>
:root {
  --bg:#111411;
  --panel:#1c211d;
  --panel2:#252c26;
  --lime:#c5ff35;
  --text:#f3f5f0;
  --muted:#929b91;
  --border:#343d34;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header {
  padding:26px 20px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}
.logo span { color:var(--lime); }
main {
  max-width:650px;
  margin:auto;
  padding:12px 18px 50px;
}
h1 { font-size:25px; margin:12px 0 8px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
button { cursor:pointer; font-weight:800; border:0; }
.homebtn {
  width:100%;
  padding:23px;
  margin:12px 0;
  border-radius:15px;
  text-align:left;
  font-size:18px;
  background:var(--lime);
  color:#151a12;
}
.homebtn.secondary {
  background:var(--panel2);
  color:var(--lime);
  border:1px solid var(--border);
}
.daygrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.daybtn,.groupbtn {
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px 12px;
  text-align:left;
  font-size:15px;
}
.daybtn span {
  display:block;
  color:var(--lime);
  font-size:11px;
  margin-bottom:7px;
}
.groupbtn {
  width:100%;
  margin:8px 0;
  padding:19px;
  color:var(--lime);
  font-size:16px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}
.exercise { font-size:15px; font-weight:700; margin-bottom:15px; }
.back {
  background:transparent;
  color:var(--lime);
  padding:8px 0 15px;
  font-size:14px;
}
.setbox {
  background:var(--panel2);
  border-radius:12px;
  padding:12px;
  margin:12px 0;
}
.settitle {
  color:var(--lime);
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:12px;
}
.fields {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
label {
  font-size:10px;
  letter-spacing:1.2px;
  color:var(--muted);
  display:block;
  margin-bottom:8px;
  font-weight:800;
}
.scroll-picker {
  height:120px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-snap-type:none;
  background:#171a17;
  border-radius:10px;
  scrollbar-width:thin;
  scrollbar-color:var(--lime) #252c26;
}
.picker-list { padding:40px 0; }
.picker-option {
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  font-size:16px;
  cursor:pointer;
  user-select:none;
}
.picker-option.selected {
  color:var(--lime);
  font-weight:900;
  font-size:22px;
}
.manual-entry {
  width:100%;
  margin-top:8px;
  background:#171a17;
  border:1px solid var(--border);
  border-radius:9px;
  color:var(--lime);
  padding:10px;
  font-size:14px;
  outline:none;
}
.hint { font-size:10px; color:var(--muted); margin-top:6px; }
.weeknav {
  display:flex;
  gap:10px;
  align-items:center;
  margin:15px 0;
}
.weeknav button,.smallbtn {
  background:var(--panel2);
  color:var(--lime);
  border:1px solid var(--border);
  padding:11px 14px;
  border-radius:9px;
}
.weeknav strong { flex:1; text-align:center; font-size:13px; }
.progressrow {
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.progressname { font-weight:700; font-size:14px; }
.progressdetail {
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
  line-height:1.7;
}
.empty { color:var(--muted); font-size:14px; padding:20px 0; }
.smallbtn { margin:8px 5px 0 0; }
footer {
  text-align:center;
  color:#626b62;
  font-size:11px;
  padding:20px;
}
</style>
</head>

<body>
<header>
  <div class="logo">GYM<span>LOG</span></div>
  <div style="color:var(--muted);font-size:11px">WORKOUT TRACKER</div>
</header>

<main id="app"></main>
<footer>GYMLOG · YOUR TRAINING RECORD</footer>

<script>
const workouts = {
  Monday: {
    Chest:[
      "Incline Dumbbell Press",
      "Smith Machine Flat Press",
      "Cable Chest Fly"
    ],
    Bicep:[
      "Incline Dumbbell Curl",
      "Preacher Curl",
      "Rope Hammer Curl"
    ]
  },
  Tuesday: {
    Back:[
      "Lat Pulldown",
      "Seated Cable Row",
      "Chest-Supported Row"
    ],
    Tricep:[
      "Overhead Rope Extension",
      "Straight-Bar Pushdown",
      "Reverse-Grip Pushdown"
    ]
  },
  Wednesday: {
    Legs:[
      "Leg Press",
      "Seated Leg Curl",
      "Leg Extension"
    ]
  },
  Thursday: {
    Shoulders:[
      "Seated Dumbbell Shoulder Press",
      "Cable Lateral Raise",
      "Reverse Pec Deck"
    ],
    Abs:[
      "Cable Crunch",
      "Hanging Knee Raise",
      "Plank"
    ]
  },
  Friday: {
    Chest:[
      "Incline Smith Machine Press",
      "Pec Deck Fly",
      "Single-Arm Cable Chest Press"
    ],
    Back:[
      "Neutral-Grip Lat Pulldown",
      "Single-Arm Cable Row",
      "Straight-Arm Cable Pulldown"
    ]
  },
  Saturday: {
    Bicep:[
      "EZ-Bar Preacher Curl",
      "Bayesian Cable Curl",
      "Hammer Curl"
    ],
    Tricep:[
      "Overhead Cable Extension",
      "Rope Pushdown",
      "Single-Arm Reverse-Grip Pushdown"
    ]
  }
};

const days=Object.keys(workouts);
const app=document.getElementById("app");
let currentDay="";
let currentGroup="";
let progressWeek="";

function getMonday(date=new Date()) {
  const d=new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function weekKey(date=getMonday()) {
  return date.getFullYear()+"-"+
    String(date.getMonth()+1).padStart(2,"0")+"-"+
    String(date.getDate()).padStart(2,"0");
}
function shiftWeek(key,amount) {
  const d=new Date(key+"T12:00:00");
  d.setDate(d.getDate()+amount*7);
  return weekKey(d);
}
function labelWeek(key) {
  const d=new Date(key+"T12:00:00");
  return "Week of "+d.toLocaleDateString("en-IN",{
    day:"numeric",month:"short",year:"numeric"
  });
}
function loadAll() {
  try {
    return JSON.parse(localStorage.getItem("gymlog_records")||"{}");
  } catch(e) { return {}; }
}
function saveAll(data) {
  localStorage.setItem("gymlog_records",JSON.stringify(data));
}
function exerciseId(day,group,exercise) {
  return day+"|"+group+"|"+exercise;
}
function numberOptions(min,max,step) {
  const a=[];
  for(let n=min;n<=max;n+=step) a.push(Number(n.toFixed(2)));
  return a;
}

/* HOME */
function showHome() {
  app.innerHTML=`
    <h1>Welcome back.</h1>
    <p class="sub">Your training. Your progress.</p>
    <button class="homebtn" onclick="showDays()">
      TRACK WORKOUT <span style="float:right">→</span>
    </button>
    <button class="homebtn secondary" onclick="showProgress()">
      TRACK PROGRESS <span style="float:right">→</span>
    </button>`;
}

/* DAYS */
function showDays() {
  app.innerHTML=`
    <button class="back" onclick="showHome()">← HOME</button>
    <h1>Track Workout</h1>
    <p class="sub">Select your training day.</p>
    <div class="daygrid">
      ${days.map((d,i)=>`
        <button class="daybtn" onclick="showGroups('${d}')">
          <span>DAY ${i+1}</span>${d.toUpperCase()} →
        </button>
      `).join("")}
    </div>`;
}

/* MUSCLE GROUPS */
function showGroups(day) {
  currentDay=day;
  app.innerHTML=`
    <button class="back" onclick="showDays()">← DAYS</button>
    <h1>${day}</h1>
    <p class="sub">Choose a muscle group.</p>
    ${Object.keys(workouts[day]).map(g=>`
      <button class="groupbtn" onclick="showExercises('${g}')">
        ${g.toUpperCase()} <span style="float:right">→</span>
      </button>
    `).join("")}`;
}

/* PICKER */
function makePicker(label,type,value,options,key,setNo) {
  const current=value??"";
  const initial=current!==""?Number(current):
    (type==="weight"?20:10);

  return `
    <div>
      <label>${label}</label>
      <div class="scroll-picker"
        data-type="${type}"
        data-key="${key}"
        data-set="${setNo}"
        onscroll="pickerScroll(this)">
        <div class="picker-list">
          ${options.map(n=>`
            <div class="picker-option ${Number(initial)===n?"selected":""}"
              data-value="${n}"
              onclick="selectPicker(this)">
              ${n}
            </div>
          `).join("")}
        </div>
      </div>
      <input class="manual-entry"
        type="number"
        inputmode="decimal"
        step="${type==="weight"?"0.5":"1"}"
        min="0"
        placeholder="Or type ${label.toLowerCase()}"
        value="${current}"
        onchange="manualPicker(this,'${key}','${type}',${setNo})">
      <div class="hint">Swipe to scroll or type a number</div>
    </div>`;
}

function saveEntry(key,type,setNo,value) {
  const data=loadAll();
  const wk=weekKey();

  if(!data[wk]) data[wk]={};
  if(!data[wk][key]) data[wk][key]={};

  data[wk][key][`set${setNo}${type}`]=value;
  data[wk][key].updated=new Date().toISOString();

  saveAll(data);
}


function centerPickerOption(picker, el) {
  const pickerRect = picker.getBoundingClientRect();
  const optionRect = el.getBoundingClientRect();

  const optionCenter = optionRect.top + optionRect.height / 2;
  const pickerCenter = pickerRect.top + picker.clientHeight / 2;

  picker.scrollTop += optionCenter - pickerCenter;
}


function selectPicker(el) {
  const picker = el.closest(".scroll-picker");
  const options = [...picker.querySelectorAll(".picker-option")];

  options.forEach(x => x.classList.remove("selected"));
  el.classList.add("selected");

  centerPickerOption(picker, el);

  const value = el.dataset.value;

  saveEntry(
    picker.dataset.key,
    picker.dataset.type,
    Number(picker.dataset.set),
    value
  );

  picker.parentElement.querySelector(".manual-entry").value = value;
}




function pickerScroll(picker) {
  if (picker.dataset.ready !== "1") return;

  clearTimeout(picker.scrollTimer);

  picker.scrollTimer = setTimeout(() => {
    const options = [...picker.querySelectorAll(".picker-option")];

    const pickerRect = picker.getBoundingClientRect();
    const pickerCenter = pickerRect.top + picker.clientHeight / 2;

    let closest = null;
    let minDistance = Infinity;

    options.forEach(el => {
      const rect = el.getBoundingClientRect();
      const optionCenter = rect.top + rect.height / 2;
      const distance = Math.abs(optionCenter - pickerCenter);

      if (distance < minDistance) {
        minDistance = distance;
        closest = el;
      }
    });

    if (!closest) return;

    // Centre the nearest number
    centerPickerOption(picker, closest);

    options.forEach(el => el.classList.remove("selected"));
    closest.classList.add("selected");

    const value = closest.dataset.value;

    saveEntry(
      picker.dataset.key,
      picker.dataset.type,
      Number(picker.dataset.set),
      value
    );

    picker.parentElement.querySelector(".manual-entry").value = value;

  }, 300);
}
    });

    if (closest) {
      options.forEach(x => x.classList.remove("selected"));
      closest.classList.add("selected");

      const value = closest.dataset.value;

      saveEntry(
        picker.dataset.key,
        picker.dataset.type,
        Number(picker.dataset.set),
        value
      );

      picker.parentElement.querySelector(".manual-entry").value = value;
    }
  }, 150);
}

function manualPicker(input, key, type, setNo) {
  const value = input.value;
  if (value === "") return;

  saveEntry(key, type, setNo, value);

  const picker = input.parentElement.querySelector(".scroll-picker");
  const options = [...picker.querySelectorAll(".picker-option")];

  const match = options.find(
    x => Number(x.dataset.value) === Number(value)
  );

  if (match) {
    options.forEach(x => x.classList.remove("selected"));
    match.classList.add("selected");
    centerPickerOption(picker, match);
  }
}



/* EXERCISES */
function showExercises(group) {
  currentGroup=group;
  const exercises=workouts[currentDay][group];
  const data=loadAll();
  const wk=weekKey();

  app.innerHTML=`
    <button class="back" onclick="showGroups('${currentDay}')">
      ← ${currentDay.toUpperCase()}
    </button>
    <h1>${group}</h1>
    <p class="sub">${labelWeek(wk)} · Record all three sets.</p>

    ${exercises.map(ex=>{
      const key=exerciseId(currentDay,group,ex);
      const entry=data[wk]?.[key]||{};

      return `
        <div class="card">
          <div class="exercise">${ex}</div>

          ${[1,2,3].map(n=>`
            <div class="setbox">
              <div class="settitle">SET ${n}</div>
              <div class="fields">
                ${makePicker(
                  "WEIGHT (KG)","weight",
                  entry[`set${n}weight`],
                  numberOptions(2.5,200,2.5),key,n
                )}
                ${makePicker(
                  "REPS","rep",
                  entry[`set${n}rep`],
                  numberOptions(6,15,1),key,n
                )}
              </div>
            </div>
          `).join("")}
        </div>`;
    }).join("")}

    <button class="smallbtn" onclick="showGroups('${currentDay}')">
      DONE
    </button>`;

  /* Position each picker at its current or suggested value. */
  app.querySelectorAll(".scroll-picker").forEach(picker=>{
    const input=picker.parentElement.querySelector(".manual-entry");
    const type=picker.dataset.type;
    const target=input.value!==""?Number(input.value):
      (type==="weight"?20:10);

    const match=[...picker.querySelectorAll(".picker-option")]
      .find(x=>Number(x.dataset.value)===target);

  if(match) {
  picker.dataset.ready="0";
  centerPickerOption(picker, match);
  setTimeout(()=>{picker.dataset.ready="1";},300);
}
  });
}

/* PROGRESS */
function showProgress() {
  progressWeek=weekKey();
  renderProgress();
}

function renderProgress() {
  const data=loadAll();
  const thisWeek=data[progressWeek]||{};
  const previousWeek=data[shiftWeek(progressWeek,-1)]||{};
  let html="";

  days.forEach(day=>{
    Object.entries(workouts[day]).forEach(([group,exercises])=>{
      exercises.forEach(ex=>{
        const key=exerciseId(day,group,ex);
        const current=thisWeek[key];
        const previous=previousWeek[key];

        if(!current) return;

        const sets=[1,2,3].map(n=>{
          const w=current[`set${n}weight`]||"—";
          const r=current[`set${n}rep`]||"—";
          const pw=previous?.[`set${n}weight`]||"—";
          const pr=previous?.[`set${n}rep`]||"—";

          let change="";
          if(pw!=="—" && w!=="—" && Number(w)!==Number(pw)) {
            const diff=Number(w)-Number(pw);
            change+=`Weight: ${diff>0?"+":""}${diff} kg<br>`;
          }
          if(pr!=="—" && r!=="—" && Number(r)!==Number(pr)) {
            const diff=Number(r)-Number(pr);
            change+=`Reps: ${diff>0?"+":""}${diff}<br>`;
          }

          return `
            <div class="progressdetail">
              <b>Set ${n}</b><br>
              This week: ${w} kg × ${r} reps<br>
              Previous week: ${pw} kg × ${pr} reps<br>
              ${change}
            </div>`;
        }).join("");

        html+=`
          <div class="progressrow">
            <div class="progressname">${ex}</div>
            <div class="progressdetail">${day} · ${group}</div>
            ${sets}
          </div>`;
      });
    });
  });

  app.innerHTML=`
    <button class="back" onclick="showHome()">← HOME</button>
    <h1>Track Progress</h1>
    <p class="sub">Compare your sets week by week.</p>

    <div class="weeknav">
      <button onclick="changeWeek(-1)">‹</button>
      <strong>${labelWeek(progressWeek)}</strong>
      <button onclick="changeWeek(1)">›</button>
    </div>

    <div class="card">
      ${html||'<div class="empty">No workout records for this week yet. Complete a workout to see your progress here.</div>'}
    </div>

    <button class="smallbtn" onclick="exportData()">EXPORT BACKUP</button>
    <button class="smallbtn" onclick="importData()">IMPORT BACKUP</button>`;
}

function changeWeek(amount) {
  progressWeek=shiftWeek(progressWeek,amount);
  renderProgress();
}

/* BACKUP */
function exportData() {
  const blob=new Blob(
    [JSON.stringify(loadAll(),null,2)],
    {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="gymlog-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json";

  input.onchange=()=>{
    const file=input.files[0];
    if(!file) return;

    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const imported=JSON.parse(reader.result);
        if(typeof imported!=="object" || !imported) throw Error();
        saveAll(imported);
        alert("Backup imported successfully.");
        renderProgress();
      } catch(e) {
        alert("Invalid backup file.");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

showHome();
</script>
</body>
</html>
