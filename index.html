
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111411">
<title>GYMLOG</title>
<style>
:root {
  --bg:#111411; --panel:#1c211d; --panel2:#252c26;
  --lime:#c5ff35; --text:#f3f5f0; --muted:#929b91;
  --border:#343d34;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial, sans-serif;min-height:100vh}
header{padding:26px 20px 18px;display:flex;
justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}
.logo span{color:var(--lime)}
main{max-width:650px;margin:auto;padding:12px 18px 50px}
h1{font-size:25px;margin:12px 0 8px}
h2{font-size:19px;margin:8px 0}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
button{cursor:pointer;font-weight:800;border:0}
.homebtn{width:100%;padding:23px;margin:12px 0;
border-radius:15px;text-align:left;font-size:18px;
background:var(--lime);color:#151a12}
.homebtn.secondary{background:var(--panel2);
color:var(--lime);border:1px solid var(--border)}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.daybtn,.groupbtn{background:var(--panel);color:var(--text);
border:1px solid var(--border);border-radius:13px;
padding:20px 12px;text-align:left;font-size:15px}
.daybtn span{display:block;color:var(--lime);
font-size:11px;margin-bottom:7px}
.groupbtn{width:100%;margin:8px 0;padding:19px;
color:var(--lime);font-size:16px}
.card{background:var(--panel);border:1px solid var(--border);
border-radius:15px;padding:15px;margin:12px 0}
.exercise{font-size:15px;font-weight:700;margin-bottom:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:10px;letter-spacing:1.3px;color:var(--muted);
display:block;margin-bottom:8px;font-weight:800}
input,select{width:100%;background:var(--panel2);
border:1px solid var(--border);border-radius:10px;
color:var(--lime);padding:13px 9px;font-size:17px;
font-weight:700;outline:none}
input:focus,select:focus{border-color:var(--lime)}
.hint{font-size:11px;color:var(--muted);margin-top:7px}
.back{background:transparent;color:var(--lime);
padding:8px 0 15px;font-size:14px}
.weeknav{display:flex;gap:10px;align-items:center;margin:15px 0}
.weeknav button{background:var(--panel2);color:var(--lime);
border-radius:9px;padding:10px 14px}
.weeknav strong{flex:1;text-align:center;font-size:13px}
.progressrow{padding:13px 0;border-bottom:1px solid var(--border)}
.progressrow:last-child{border:0}
.progressname{font-weight:700;font-size:14px}
.progressdetail{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}
.change{color:var(--lime);font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:20px 0}
.smallbtn{background:var(--panel2);color:var(--lime);
border:1px solid var(--border);padding:11px 14px;
border-radius:9px;margin-top:12px}
footer{text-align:center;color:#626b62;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo">GYM<span>LOG</span></div>
  <div style="color:var(--muted);font-size:11px">WORKOUT TRACKER</div>
</header>
<main id="app"></main>
<footer>GYMLOG · YOUR TRAINING RECORD</footer>

<script>
const workouts = {
  Monday: {
    Chest:["Incline Dumbbell Press","Smith Machine Flat Press","Cable Chest Fly"],
    Bicep:["Incline Dumbbell Curl","Preacher Curl","Rope Hammer Curl"]
  },
  Tuesday: {
    Back:["Lat Pulldown","Seated Cable Row","Chest-Supported Row"],
    Tricep:["Overhead Rope Extension","Straight-Bar Pushdown","Reverse-Grip Pushdown"]
  },
  Wednesday: {
    Legs:["Leg Press","Seated Leg Curl","Leg Extension"]
  },
  Thursday: {
    Shoulders:["Seated Dumbbell Shoulder Press","Cable Lateral Raise","Reverse Pec Deck"],
    Abs:["Cable Crunch","Hanging Knee Raise","Plank"]
  },
  Friday: {
    Chest:["Incline Smith Machine Press","Pec Deck Fly","Single-Arm Cable Chest Press"],
    Back:["Neutral-Grip Lat Pulldown","Single-Arm Cable Row","Straight-Arm Cable Pulldown"]
  },
  Saturday: {
    Bicep:["EZ-Bar Preacher Curl","Bayesian Cable Curl","Hammer Curl"],
    Tricep:["Overhead Cable Extension","Rope Pushdown","Single-Arm Reverse-Grip Pushdown"]
  }
};

const days = Object.keys(workouts);
const app = document.getElementById("app");
let currentDay = "";
let currentGroup = "";

function getMonday(date=new Date()){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  const offset=(d.getDay()+6)%7;
  d.setDate(d.getDate()-offset);
  return d;
}
function weekKey(date=getMonday()){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")
    +"-"+String(date.getDate()).padStart(2,"0");
}
function shiftWeek(key,amount){
  const d=new Date(key+"T12:00:00");
  d.setDate(d.getDate()+amount*7);
  return weekKey(d);
}
function labelWeek(key){
  const d=new Date(key+"T12:00:00");
  return "Week of "+d.toLocaleDateString("en-IN",
    {day:"numeric",month:"short",year:"numeric"});
}
function loadAll(){
  try{return JSON.parse(localStorage.getItem("gymlog_records")||"{}")}
  catch(e){return {}}
}
function saveAll(data){
  localStorage.setItem("gymlog_records",JSON.stringify(data));
}
function id(day,group,exercise){
  return day+"|"+group+"|"+exercise;
}
function showHome(){
  app.innerHTML=`
    <h1>Welcome back.</h1>
    <p class="sub">Your training. Your progress.</p>
    <button class="homebtn" onclick="showDays()">
      TRACK WORKOUT <span style="float:right">→</span>
    </button>
    <button class="homebtn secondary" onclick="showProgress()">
      TRACK PROGRESS <span style="float:right">→</span>
    </button>`;
}
function showDays(){
  app.innerHTML=`
    <button class="back" onclick="showHome()">← HOME</button>
    <h1>Track Workout</h1>
    <p class="sub">Select your training day.</p>
    <div class="daygrid">
      ${days.map((d,i)=>`
        <button class="daybtn" onclick="showGroups('${d}')">
          <span>DAY ${i+1}</span>${d.toUpperCase()} →
        </button>`).join("")}
    </div>`;
}
function showGroups(day){
  currentDay=day;
  const groups=workouts[day];
  app.innerHTML=`
    <button class="back" onclick="showDays()">← DAYS</button>
    <h1>${day}</h1>
    <p class="sub">Choose a muscle group.</p>
    ${Object.keys(groups).map(g=>`
      <button class="groupbtn" onclick="showExercises('${g}')">
        ${g.toUpperCase()} <span style="float:right">→</span>
      </button>`).join("")}`;
}
function numberOptions(min,max,step){
  let a=[];
  for(let n=min;n<=max;n+=step)a.push(n);
  return a;
}
function makePicker(label,type,value,options,exerciseId){
  const opts=options.map(n=>`
    <option value="${n}" ${Number(value)===n?"selected":""}>${n}</option>`
  ).join("");
  return `
    <div>
      <label>${label}</label>
      <input list="${type}-${exerciseId}" type="number"
        inputmode="decimal" step="${type==="weight"?"0.5":"1"}"
        min="${type==="weight"?"0":"1"}"
        max="${type==="rep"?"100":"500"}"
        placeholder="Select or type" value="${value??""}"
        onchange="saveEntry('${exerciseId}','${type}',this.value)"
        oninput="saveEntry('${exerciseId}','${type}',this.value)">
      <datalist id="${type}-${exerciseId}">
        ${opts}
      </datalist>
      <div class="hint">Scroll suggestions or type a number</div>
    </div>`;
}
function showExercises(group){
  currentGroup=group;
  const exercises=workouts[currentDay][group];
  const data=loadAll();
  const wk=weekKey();
  app.innerHTML=`
    <button class="back" onclick="showGroups('${currentDay}')">← ${currentDay.toUpperCase()}</button>
    <h1>${group}</h1>
    <p class="sub">${labelWeek(wk)} · Enter your workout performance.</p>
    ${exercises.map(ex=>{
      const key=id(currentDay,group,ex);
      const entry=data[wk]?.[key]||{};
      return `<div class="card">
        <div class="exercise">${ex}</div>
        <div class="fields">
          ${makePicker("WEIGHT (KG)","weight",entry.weight,
            numberOptions(5,200,2.5),key)}
          ${makePicker("REPS","rep",entry.rep,
            numberOptions(1,30,1),key)}
        </div>
      </div>`;
    }).join("")}
    <button class="smallbtn" onclick="showGroups('${currentDay}')">DONE</button>`;
}
function saveEntry(key,type,value){
  const data=loadAll();
  const wk=weekKey();
  if(!data[wk])data[wk]={};
  if(!data[wk][key])data[wk][key]={};
  data[wk][key][type]=value;
  data[wk][key].updated=new Date().toISOString();
  saveAll(data);
}
let progressWeek=weekKey();
function showProgress(){
  progressWeek=weekKey();
  renderProgress();
}
function renderProgress(){
  const data=loadAll();
  const thisWeek=data[progressWeek]||{};
  let html="";
  days.forEach(day=>{
    Object.entries(workouts[day]).forEach(([group,exercises])=>{
      exercises.forEach(ex=>{
        const key=id(day,group,ex);
        const current=thisWeek[key];
        if(!current || (current.weight==="" && current.rep===""))return;
        const previousKey=shiftWeek(progressWeek,-1);
        const previous=data[previousKey]?.[key];
        let comparison="No previous-week record";
        if(previous){
          const wdiff=Number(current.weight)-Number(previous.weight);
          const rdiff=Number(current.rep)-Number(previous.rep);
          comparison=`Previous week: ${previous.weight||"—"} kg × ${previous.rep||"—"} reps`;
          if(current.weight!=="" && previous.weight!=="" && wdiff!==0)
            comparison+=`<br>Weight: <span class="change">${wdiff>0?"+":""}${wdiff} kg</span>`;
          if(current.rep!=="" && previous.rep!=="" && rdiff!==0)
            comparison+=`<br>Reps: <span class="change">${rdiff>0?"+":""}${rdiff}</span>`;
        }
        html+=`
          <div class="progressrow">
            <div class="progressname">${ex}</div>
            <div class="progressdetail">
              ${day} · ${group}<br>
              This week: ${current.weight||"—"} kg × ${current.rep||"—"} reps<br>
              ${comparison}
            </div>
          </div>`;
      });
    });
  });
  app.innerHTML=`
    <button class="back" onclick="showHome()">← HOME</button>
    <h1>Track Progress</h1>
    <p class="sub">Review your workout performance week by week.</p>
    <div class="weeknav">
      <button onclick="changeWeek(-1)">‹</button>
      <strong>${labelWeek(progressWeek)}</strong>
      <button onclick="changeWeek(1)">›</button>
    </div>
    <div class="card">
      ${html||'<div class="empty">No workout records for this week yet. Complete a workout to see your progress here.</div>'}
    </div>
    <p class="hint">Progress compares each exercise with the previous week.</p>
    <button class="smallbtn" onclick="exportData()">EXPORT BACKUP</button>
    <button class="smallbtn" onclick="importData()">IMPORT BACKUP</button>`;
}
function changeWeek(amount){
  progressWeek=shiftWeek(progressWeek,amount);
  renderProgress();
}
function exportData(){
  const blob=new Blob([JSON.stringify(loadAll(),null,2)],
    {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="gymlog-backup.json";a.click();
  URL.revokeObjectURL(url);
}
function importData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{
    const file=input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=JSON.parse(reader.result);
        if(typeof imported!=="object"||!imported)throw Error();
        saveAll(imported);alert("Backup imported successfully.");
        renderProgress();
      }catch(e){alert("Invalid backup file.");}
    };
    reader.readAsText(file);
  };
  input.click();
}
showHome();
</script>
</body>
</html>
